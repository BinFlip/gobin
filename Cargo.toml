[package]
name = "gobin"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
description = "Static analysis library for Go compiled binaries - identification and metadata extraction"
license = "Apache-2.0"
repository = "https://github.com/ATRAPSLLC/gobin"
readme = "README.md"
keywords = ["golang", "go", "parser", "reverse-engineering", "binary-analysis"]
categories = ["parser-implementations"]
exclude = ["tests/samples/"]

# gobin is used in malware-analysis pipelines where every input byte is
# adversarial. These lints prevent the parser from panicking on malformed
# input. The `cfg_attr(test, allow(...))` escape hatch in `src/lib.rs`
# lets tests still use `unwrap`/`expect`/`panic` for terseness.
[lints.rust]
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"

[dependencies]
# We only parse single ELF / Mach-O / PE executables (the three formats
# dispatched in `formats.rs`), so drop goblin's default `te` (UEFI Terse
# Executable) feature — not a Go output format. (`archive` cannot be
# dropped: goblin's `mach32`/`mach64` features hard-require it.) PE
# resource/import/cert/TLS *parsing* is disabled separately at the call
# site via `ParseOptions`. `endian_fd` + `std` stay for sliced reads.
goblin = { version = "0.10.7", default-features = false, features = [
    "elf32",
    "elf64",
    "mach32",
    "mach64",
    "pe32",
    "pe64",
    "endian_fd",
    "std",
] }

[dev-dependencies]
